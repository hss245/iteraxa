[package]
name = "iteraxa"
version = "0.4.0"
edition = "2021"
description = "Goal runner for Claude Code, Codex and Cursor"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
